name: Android CI

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.SIGNING_KEY }}  # Uses the encoded signing key stored in GitHub Secrets.
      run: |
        if [ -n "$ENCODED_STRING" ]; then
          echo $ENCODED_STRING | base64 -di > app/scrcpy.jks
          echo "Keystore decoded successfully."
        else
          echo "No signing key found, skipping..."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      env:
        SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - name: List files in the repository
      run: |
          ls ${{ github.workspace }}/app/build/outputs/apk/scrcpy/

    - name: Upload Unsigned Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ScrcpyForAndroid-debug
        path: |
          app/build/outputs/apk/scrcpy/release/*.apk
        retention-days: 90  # Sets the artifact retention period to 90 days.
